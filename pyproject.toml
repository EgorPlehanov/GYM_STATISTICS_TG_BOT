[project]
name = "gym-statistics"
version = "0.1.0"
description = "Telegram bot, web app and API for training statistics."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiofiles==23.2.1",
    "aiogram==3.4.1",
    "aiogram3-calendar==0.1.2",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "cairosvg==2.7.1",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "kaleido==0.2.1",
    "matplotlib==3.8.4",
    "openpyxl==3.1.2",
    "pandas==2.2.2",
    "pillow==10.3.0",
    "plotly==5.20.0",
    "psycopg[binary]==3.1.18",
    "pydantic==2.5.3",
    "pydantic-settings==2.2.1",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "pyrogram==2.0.106",
    "pysocks==1.7.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "pytz==2024.1",
    "sqlalchemy==2.0.29",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
