[project]
name = "gym-statistics"
version = "0.1.0"
description = "Telegram bot, web app and API for training statistics."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "aiogram==3.31.0",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "cachetools==5.3.3",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "openpyxl==3.1.2",
    "psycopg[binary]==3.1.18",
    "pydantic==2.5.3",
    "pydantic-settings==2.2.1",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "sqlalchemy==2.0.29",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
