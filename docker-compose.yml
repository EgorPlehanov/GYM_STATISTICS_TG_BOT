version: "3.7"

services:
  db:
    image: postgres
    container_name: postgres-container
    restart: always
    env_file:
      - ./.env
    ports:
      - "6500:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    restart: always
    container_name: bot-container
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - db

  migrate:
    build: .
    container_name: migrate-container
    profiles:
      - tools
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - db
    command: >
      sh -c "uv run alembic upgrade head && uv run python -m app.db.seed"

  db-reset:
    build: .
    container_name: db-reset-container
    profiles:
      - tools
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - db
    command: uv run python -m app.db.reset

volumes:
  pgdata: 
