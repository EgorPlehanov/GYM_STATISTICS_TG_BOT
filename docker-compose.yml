services:
  db:
    image: postgres:18-alpine
    container_name: postgres-container
    restart: always
    env_file:
      - ./.env
    ports:
      - "6500:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  bot:
    build: .
    restart: always
    container_name: bot-container
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  api:
    build: .
    restart: always
    container_name: api-container
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "uv run python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: .
    container_name: migrate-container
    profiles:
      - tools
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head && uv run python -m app.db.seed"

  db-reset:
    build: .
    container_name: db-reset-container
    profiles:
      - tools
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    command: uv run python -m app.db.reset

volumes:
  pgdata: 
